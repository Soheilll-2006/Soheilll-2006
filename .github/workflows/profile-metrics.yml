name: Refresh profile activity metrics

on:
  push:
    branches:
      - main
      - profile-redesign-2026
    paths-ignore:
      - README.md
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh clickable activity metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Soheilll-2006
        run: python scripts/generate_profile_metrics.py

      - name: Commit refreshed metrics
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Metrics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile activity metrics [skip ci]"
          git push
