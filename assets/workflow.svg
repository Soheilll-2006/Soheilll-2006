<rect width="1200" height="190" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="188" rx="27" stroke="#25415F" stroke-opacity=".8"/>
<text x="52" y="42" fill="#FFFFFF" font-size="20" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif">MY LOOP</text>
<text x="1148" y="42" text-anchor="end" fill="#637B97" font-size="12" font-family="Consolas,monospace">repeat until boring becomes reliable</text>

