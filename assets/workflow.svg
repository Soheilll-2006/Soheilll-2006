  <g transform="translate(360 92)"><circle r="20" fill="#0F2746" stroke="#2DE2E6" stroke-width="3"/><text y="5" fill="#2DE2E6" font-size="12" font-weight="800">02</text><text y="54" fill="#FFFFFF" font-size="15" font-weight="700">BREAK</text></g>
  <g transform="translate(600 92)"><circle r="20" fill="#0F2746" stroke="#7EE787" stroke-width="3"/><text y="5" fill="#7EE787" font-size="12" font-weight="800">03</text><text y="54" fill="#FFFFFF" font-size="15" font-weight="700">UNDERSTAND</text></g>
  <g transform="translate(840 92)"><circle r="20" fill="#0F2746" stroke="#F2CC60" stroke-width="3"/><text y="5" fill="#F2CC60" font-size="12" font-weight="800">04</text><text y="54" fill="#FFFFFF" font-size="15" font-weight="700">SIMPLIFY</text></g>
  <g transform="translate(1080 92)"><circle r="20" fill="#0F2746" stroke="#FF7B72" stroke-width="3"/><text y="5" fill="#FF7B72" font-size="12" font-weight="800">05</text><text y="54" fill="#FFFFFF" font-size="15" font-weight="700">SHIP</text></g>
