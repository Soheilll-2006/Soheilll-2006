<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0A1630"/>
      <stop offset="100%" stop-color="#08263A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#2DE2E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5B7194" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <circle cx="1055" cy="72" r="105" fill="#00D9FF" opacity=".035"/>
  <circle cx="1110" cy="122" r="64" fill="#58A6FF" opacity=".045"/>

  <g opacity=".42" stroke="url(#accent)" fill="none" stroke-width="2">
    <path d="M980 92h42l22 22h84"/>
    <path d="M945 158h64l24-24h95"/>
    <path d="M1014 222h48l18-18h73"/>
    <circle cx="980" cy="92" r="4" fill="#58A6FF" stroke="none"/>
    <circle cx="945" cy="158" r="4" fill="#2DE2E6" stroke="none"/>
    <circle cx="1014" cy="222" r="4" fill="#58A6FF" stroke="none"/>
  </g>

  <g transform="translate(80 70)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#0D2038" stroke="#2DE2E6" stroke-opacity=".55"/>
    <path d="M18 18l-10 9 10 9M36 18l10 9-10 9" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="80" y="175" fill="#FFFFFF" font-size="62" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="2">SOHEIL</text>
  <rect x="80" y="192" width="190" height="4" rx="2" fill="url(#accent)" filter="url(#softGlow)"/>
  <text x="80" y="230" fill="#B8C7DE" font-size="22" font-weight="500" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">PYTHON AUTOMATION  /  BACKEND TOOLING  /  FLUTTER PRODUCTS</text>
  <text x="80" y="266" fill="#7488A5" font-size="16" font-family="JetBrains Mono,Consolas,monospace">build systems · remove repetitive work · ship reliable software</text>

  <g transform="translate(974 124)" font-family="JetBrains Mono,Consolas,monospace">
    <text x="0" y="0" fill="#58A6FF" font-size="18">&gt; automate()</text>
    <text x="18" y="36" fill="#2DE2E6" font-size="18">&gt; build()</text>
    <text x="36" y="72" fill="#7EE787" font-size="18">&gt; ship()</text>
  </g>
</svg>